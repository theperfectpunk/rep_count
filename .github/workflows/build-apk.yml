name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 🛑 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🐘 Setup Gradle & Cache
        uses: gradle/actions/setup-gradle@v3

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install Dependencies
        run: npm ci || npm install

      - name: 🛠️ Expo Prebuild (Generate Native Android Project)
        run: npx expo prebuild --platform android --clean

      - name: 🔑 Set Gradle Permissions
        run: chmod +x android/gradlew

      - name: 🏗️ Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: 📤 Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RepCount-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: 🚀 Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'RepCount Release v1.0.0' }}
          files: android/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

