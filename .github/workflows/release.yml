name: Build & Create GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Flutter App & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17 JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter --version

      - name: Generate Platform Scaffolding
        run: flutter create . --org com.theperfectpunk --project-name rep_count --platforms=android,web

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Automated Unit Tests
        run: flutter test

      - name: Build Release Android APK
        run: flutter build apk --release

      - name: Build Release Web Bundle
        run: flutter build web --release

      - name: Compress Web Bundle
        run: |
          cd build/web
          zip -r ../../web-build.zip .
          cd ../..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            web-build.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
